[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbank-cli-mcp"
version = "0.1.0"
description = "Локальный read-only CLI и stdio MCP для личного кабинета Т‑Банка"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "tbank-cli-mcp contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
tbank = "tbank_cli.__main__:main"
tbank-mcp = "tbank_cli.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
